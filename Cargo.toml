[package]
build = "src/build.rs"
edition = "2024"
name = "deck-rs"
version = "0.2.0"

[dependencies]
gilrs = "0.11"
serde = { features = ["derive"], version = "1" }
slint = { version = "~1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit-wayland",
    "backend-winit-x11",
    "renderer-femtovg",
    "renderer-software",
] }
toml = "1"

[build-dependencies]
slint-build = "~1.18.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
