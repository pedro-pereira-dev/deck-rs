[package]
edition = "2024"
name = "deck-rs"
version = "0.1.0"

[dependencies]
gilrs = "0.11"
iced = { features = ["tokio"], version = "0.14" }
serde = { features = ["derive"], version = "1" }
sysinfo = "0.37"
tokio = { features = ["macros", "fs", "process", "time"], version = "1" }
toml = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
