[ui]
animation_speed = 180
background = "#000000"
background_image = ""
font_family = "Symbols Nerd Font Mono"
font_size = 16.0
foreground = "#ffffff"
# application entries
categories = []
favorites = []
icons = {}

[ui.clock]
date_format = "%A, %-d of %B %Y"
date_size = 1.25
float = "center"
gap = 0.25
time_format = "%H:%M"
time_size = 7.5
padding_left = 4
padding_top = 4

[commands]
audio_mute = ["wpctl", "set-mute", "@DEFAULT_AUDIO_SINK@", "toggle"]
audio_volume_down = ["wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@", "5%-"]
audio_volume_up = ["wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@", "5%+"]
bluetooth_off = ["bluetoothctl", "power", "off"]
bluetooth_on = ["bluetoothctl", "power", "on"]
bluetooth_scan = ["bluetoothctl", "scan", "on"]
exit_session = ["loginctl", "terminate-session", "$XDG_SESSION_ID"]
power_off = ["systemctl", "poweroff"]
reboot = ["systemctl", "reboot"]
suspend = ["systemctl", "suspend"]
wifi_off = ["nmcli", "radio", "wifi", "off"]
wifi_on = ["nmcli", "radio", "wifi", "on"]
wifi_scan = ["nmcli", "device", "wifi", "rescan"]

[input]
stick_threshold = 0.6

[input.gamepad]
dpad_down = "down"
dpad_left = "left"
dpad_right = "right"
dpad_up = "up"
east = "back"
mode = "menu"
select = "back"
south = "select"
stick_down = "down"
stick_left = "left"
stick_right = "right"
stick_up = "up"
start = "menu"

[input.keyboard]
back = "Escape"
down = "DownArrow"
left = "LeftArrow"
menu = "Home"
right = "RightArrow"
select = "Enter"
up = "UpArrow"

[ui.example]
back_button_font_percent = 3.5
back_button_height_percent = 8.0
back_button_left_percent = 40.0
back_button_top_percent = 46.0
back_button_width_percent = 20.0

[ui.xmb]
category_center_percent = 50.0
category_center_y_percent = 33.0
category_gap_percent = 7.875
category_icon_height_percent = 14.0
category_icon_percent = 5.0
category_icon_width_percent = 7.875
category_selected_icon_percent = 6.0
error_bottom_percent = 5.0
error_font_percent = 1.5
error_horizontal_padding_percent = 3.375
